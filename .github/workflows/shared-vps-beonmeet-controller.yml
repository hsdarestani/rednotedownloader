name: Boot isolated fresh BeOnMeet controller on shared VPS
on:
  push:
    branches: [ops/shared-vps-inventory-20261022]
    paths: [.github/workflows/shared-vps-beonmeet-controller.yml]
permissions:
  contents: read
concurrency:
  group: pars-vps-staging
  cancel-in-progress: false
jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm target
        env:
          T: ${{ secrets.HOST }}
        run: test "$T" = "143.20.60.195"
      - name: Run fresh BeOnMeet lightweight controller and SQLite
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          port: ${{ secrets.SSH_PORT || '9011' }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 300 9
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            systemctl is-active --quiet rednotedownloader
            test "$(df -Pk / | awk 'NR==2 {print $4}')" -gt 850000
            cd /opt/beonmeet
            test -d .git
            git fetch --depth=1 origin ops/shared-vps-source-audit-20261022
            git checkout --detach FETCH_HEAD
            grep -q BEONMEET_STAGING_NO_POLL app/main.py
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3.12-venv ffmpeg
            apt-get clean
            rm -rf /var/lib/apt/lists/*
            test "$(df -Pk / | awk 'NR==2 {print $4}')" -gt 650000
            python3 -m venv /opt/beonmeet/.venv
            /opt/beonmeet/.venv/bin/pip install --no-cache-dir 'fastapi==0.115.12' 'uvicorn[standard]==0.34.2' 'httpx==0.28.1' 'google-api-python-client==2.169.0' 'google-auth==2.40.1' 'google-auth-oauthlib==1.2.2' 'python-dateutil==2.9.0.post0' 'redis==5.2.1'
            if ! id beonmeet >/dev/null 2>&1; then
              useradd --system --home /opt/beonmeet --shell /usr/sbin/nologin beonmeet
            fi
            install -o beonmeet -g beonmeet -m 0700 -d /opt/beonmeet/data /dev/shm/beonmeet
            if [ ! -f /opt/beonmeet/.env ]; then
              umask 077
              cat > /opt/beonmeet/.env <<EOF
            BEONMEET_STAGING_NO_POLL=1
            BEONMEET_DATA_DIR=/opt/beonmeet/data
            BEONMEET_DB_PATH=/opt/beonmeet/data/beonmeet.db
            RECORDING_TMP_DIR=/dev/shm/beonmeet
            DOMAIN=beonmeet.smarbiz.sbs
            GOOGLE_CLIENT_ID=
            GOOGLE_CLIENT_SECRET=
            GOOGLE_REDIRECT_URI=https://beonmeet.smarbiz.sbs/auth/google/callback
            TELEGRAM_BOT_TOKEN=
            ADMINUSER=
            INTERNAL_SECRET=$(openssl rand -hex 32)
            AUTOSCALE_ENABLED=false
            FREE_MEETING_SLOTS=0
            PREMIUM_MEETING_SLOTS=0
            BOT_EMAIL=meetrecorderbot@gmail.com
            EOF
              chmod 600 /opt/beonmeet/.env
            fi
            cat > /etc/systemd/system/beonmeet-controller.service <<'EOF'
            [Unit]
            Description=BeOnMeet controller fresh-install without recorder workers
            Wants=network-online.target
            After=network-online.target
            [Service]
            Type=simple
            User=beonmeet
            Group=beonmeet
            WorkingDirectory=/opt/beonmeet/app
            EnvironmentFile=/opt/beonmeet/.env
            ExecStart=/opt/beonmeet/.venv/bin/uvicorn main:app --host 127.0.0.1 --port 8109
            Restart=on-failure
            RestartSec=8
            MemoryMax=280M
            NoNewPrivileges=true
            PrivateTmp=true
            ProtectSystem=strict
            ReadWritePaths=/opt/beonmeet/data /dev/shm/beonmeet
            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable --now beonmeet-controller
            sleep 6
            if ! curl -fsS --max-time 10 http://127.0.0.1:8109/health; then
              systemctl status beonmeet-controller --no-pager | tail -15 || true
              journalctl -u beonmeet-controller --no-pager -n 40 || true
              exit 1
            fi
            echo
            systemctl is-active --quiet beonmeet-controller
            systemctl is-active --quiet hamoon-dashboard
            systemctl is-active --quiet rednotedownloader
            curl -fsS --max-time 5 http://127.0.0.1:8106/health >/dev/null
            curl -fsS --max-time 5 http://127.0.0.1:8117/health >/dev/null
            nginx -t
            echo "Disk/memory:"
            df -h /; free -h
            echo "BEONMEET_CONTROLLER_FRESH_READY, RECORDER_WORKERS_NOT_INSTALLED"
