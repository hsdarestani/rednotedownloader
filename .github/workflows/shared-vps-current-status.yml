name: Read-only current service check
on:
  push:
    branches: [ops/shared-vps-inventory-20261022]
    paths: [.github/workflows/shared-vps-current-status.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate destination
        env:
          TARGET: ${{ secrets.HOST }}
        run: test "$TARGET" = "143.20.60.195"
      - name: Inspect services, no writes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT || '9011' }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 3m
          script: |
            set -eu
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            date -u
            df -h /; free -h
            docker ps --format '{{.Names}} | {{.Status}} | {{.Ports}}'
            for url in http://127.0.0.1:8106/health http://127.0.0.1:8107/health http://127.0.0.1:8117/health; do
              printf 'probe %s: ' "$url"
              curl --max-time 3 -sS -o /dev/null -w '%{http_code}\n' "$url" || true
            done
            echo 'CamCam internal gateway route health'
            for route in / /pet /camera /health; do
              printf 'CamCam %s: ' "$route"
              curl --max-time 5 -sS -H 'Host: camcam.smarbiz.sbs' -o /dev/null -w '%{http_code} %{content_type}\n' "http://127.0.0.1:8117$route" || true
            done
            echo 'TLS certificates available (public metadata only)'
            find /etc/letsencrypt/live -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null || true
            for f in /etc/letsencrypt/live/*/fullchain.pem; do
              test -r "$f" || continue
              echo "$f"
              openssl x509 -in "$f" -noout -ext subjectAltName 2>/dev/null | tail -3 || true
            done
            echo 'Configured nginx https names'
            grep -Rh 'server_name' /etc/nginx/sites-enabled 2>/dev/null | head -25 || true
            systemctl is-active rednotedownloader
            nginx -t
