name: Publish four HTTPS applications with exact-host nginx proxy
on:
  push:
    branches: [ops/shared-vps-inventory-20261022]
    paths: [.github/workflows/shared-vps-enable-https.yml]
permissions:
  contents: read
concurrency:
  group: pars-vps-staging
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check exact target
        env:
          H: ${{ secrets.HOST }}
        run: test "$H" = "143.20.60.195"
      - name: Install only four HTTPS hostnames and keep all legacy sites
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT || '9011' }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 9m
          script: |
            set -euo pipefail
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 300 9
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            systemctl is-active --quiet rednotedownloader
            nginx -t
            for domain in camcam.smarbiz.sbs beonmeet.smarbiz.sbs bebinkarato.smarbiz.sbs pay.hamooncloud.ir; do
              test -s "/etc/letsencrypt/live/$domain/fullchain.pem"
              test -s "/etc/letsencrypt/live/$domain/privkey.pem"
              test -L "/etc/nginx/sites-enabled/shared-vps-acme-$domain"
              test ! -e "/etc/nginx/sites-available/shared-vps-https-$domain"
              test ! -e "/etc/nginx/sites-enabled/shared-vps-https-$domain"
            done
            for port in 8106 8108 8109 8117; do
              curl -fsS --max-time 5 "http://127.0.0.1:$port/health" >/dev/null
            done
            INSTALL_TAG=shared-vps-https-20261023
            install -d -m 0700 "/etc/nginx/$INSTALL_TAG-backup"
            for domain in camcam.smarbiz.sbs beonmeet.smarbiz.sbs bebinkarato.smarbiz.sbs pay.hamooncloud.ir; do
              cp -p "/etc/nginx/sites-available/shared-vps-acme-$domain" "/etc/nginx/$INSTALL_TAG-backup/shared-vps-acme-$domain"
            done
            rollback() {
              echo "HTTPS activation error: restoring previous exact-host Nginx state"
              for domain in camcam.smarbiz.sbs beonmeet.smarbiz.sbs bebinkarato.smarbiz.sbs pay.hamooncloud.ir; do
                rm -f "/etc/nginx/sites-enabled/shared-vps-https-$domain" "/etc/nginx/sites-available/shared-vps-https-$domain"
                cp -p "/etc/nginx/$INSTALL_TAG-backup/shared-vps-acme-$domain" "/etc/nginx/sites-available/shared-vps-acme-$domain"
              done
              nginx -t && systemctl reload nginx || true
            }
            trap rollback ERR
            for domain in camcam.smarbiz.sbs beonmeet.smarbiz.sbs bebinkarato.smarbiz.sbs pay.hamooncloud.ir; do
              case "$domain" in
                camcam.smarbiz.sbs) PORT=8117; BODY=512m ;;
                beonmeet.smarbiz.sbs) PORT=8109; BODY=100m ;;
                bebinkarato.smarbiz.sbs) PORT=8106; BODY=100m ;;
                pay.hamooncloud.ir) PORT=8108; BODY=100m ;;
                *) exit 1 ;;
              esac
              cat >"/etc/nginx/sites-available/shared-vps-https-$domain" <<EOF
            # TLS reverse proxy: exact hostname $domain; existing sites unchanged.
            server {
                listen 443 ssl;
                server_name $domain;
                ssl_certificate /etc/letsencrypt/live/$domain/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/$domain/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_session_timeout 1d;
                server_tokens off;
                client_max_body_size $BODY;
                add_header X-Content-Type-Options nosniff always;
                add_header Referrer-Policy strict-origin-when-cross-origin always;
                location / {
                    proxy_pass http://127.0.0.1:$PORT;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                    proxy_set_header X-Forwarded-Host \$host;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_read_timeout 300s;
                    proxy_send_timeout 300s;
                }
            }
            EOF
              ln -s "/etc/nginx/sites-available/shared-vps-https-$domain" "/etc/nginx/sites-enabled/shared-vps-https-$domain"
            done
            python3 - <<'PY'
            from pathlib import Path
            for domain in ['camcam.smarbiz.sbs','beonmeet.smarbiz.sbs','bebinkarato.smarbiz.sbs','pay.hamooncloud.ir']:
                p=Path('/etc/nginx/sites-available/shared-vps-acme-'+domain)
                text=p.read_text()
                assert text.count('return 503;')==1
                text=text.replace('return 503;','return 301 https://$host$request_uri;')
                p.write_text(text)
            PY
            nginx -t
            systemctl reload nginx
            sleep 2
            for pair in camcam.smarbiz.sbs:8117 beonmeet.smarbiz.sbs:8109 bebinkarato.smarbiz.sbs:8106 pay.hamooncloud.ir:8108; do
              domain="${pair%%:*}"
              port="${pair##*:}"
              echo "TLS local ingress $domain"
              curl -fsS --max-time 10 --resolve "$domain:443:127.0.0.1" "https://$domain/health" >/tmp/shared-vps-health-"$port".json
              python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x.get("ok") is True; print("HEALTH_HTTPS_OK",sys.argv[2])' "/tmp/shared-vps-health-$port.json" "$domain"
              PLAIN="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' -H "Host: $domain" http://127.0.0.1/)"
              test "$PLAIN" = 301
            done
            systemctl is-active --quiet rednotedownloader
            systemctl is-active --quiet hamoon-dashboard
            systemctl is-active --quiet beonmeet-controller
            nginx -t
            trap - ERR
            echo 'FOUR_DOMAINS_PUBLISHED_WITH_PUBLICLY_TRUSTED_TLS'
