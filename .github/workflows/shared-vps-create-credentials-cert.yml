name: Generate host-only credentials encryption certificate
on:
  push:
    branches: [ops/shared-vps-inventory-20261022]
    paths: [.github/workflows/shared-vps-create-credentials-cert.yml]
permissions:
  contents: read
jobs:
  host-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm VPS
        env:
          EXPECTED_IP: ${{ secrets.HOST }}
        run: test "$EXPECTED_IP" = "143.20.60.195"
      - name: Create certificate and print PUBLIC certificate only
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT || '9011' }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            install -d -m 0700 /etc/shared-vps-secrets
            if [ ! -e /etc/shared-vps-secrets/recipient.key ] && [ ! -e /etc/shared-vps-secrets/recipient.crt ]; then
              openssl req -x509 -newkey rsa:4096 -noenc -keyout /etc/shared-vps-secrets/recipient.key -out /etc/shared-vps-secrets/recipient.crt -days 90 -subj '/CN=shared-vps-secrets-recipient' >/dev/null 2>&1
              chmod 600 /etc/shared-vps-secrets/recipient.key
              chmod 644 /etc/shared-vps-secrets/recipient.crt
            fi
            test -r /etc/shared-vps-secrets/recipient.key
            test -r /etc/shared-vps-secrets/recipient.crt
            echo "PUBLIC_X509_CERTIFICATE_BEGIN"
            cat /etc/shared-vps-secrets/recipient.crt
            echo "PUBLIC_X509_CERTIFICATE_END"
            openssl x509 -in /etc/shared-vps-secrets/recipient.crt -noout -fingerprint -sha256
            systemctl is-active --quiet rednotedownloader
