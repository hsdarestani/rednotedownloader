name: Deploy Rishe parallel on Pars VDS
on:
  push:
    branches: [infra/rishe-parallel]
    paths:
      - '.github/workflows/rishe-parallel.yml'
      - 'rishe/**'
permissions:
  contents: read
concurrency:
  group: pars-vds-rishe-parallel
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout isolated deployment scripts
        uses: actions/checkout@v4
      - name: Read latest Rishe production source
        run: |
          git clone --depth=1 --branch main https://github.com/hsdarestani/rishestore.git source-rishe
          echo "RISHE_SHA=$(git -C source-rishe rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build Rishe image on GitHub runner (not VPS)
        run: |
          docker build -t rishe-pars:latest source-rishe
          docker save rishe-pars:latest | gzip -1 > rishe-image.tar.gz
          ls -lh rishe-image.tar.gz
      - name: Install transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Upload release and deploy to isolated folder
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          test "$HOST" = "143.20.60.195" || { echo "Wrong target host"; exit 1; }
          test -n "$PASS" || { echo "Missing SSH password"; exit 1; }
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-9011}"
          ARGS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20)
          sshpass -e ssh -p "$PORT" "${ARGS[@]}" "root@$HOST" 'install -d -m 700 /opt/rishestore-pars'
          sshpass -e scp -P "$PORT" "${ARGS[@]}" \
            rishe-image.tar.gz rishe/compose.yml rishe/deploy.sh "root@$HOST:/opt/rishestore-pars/"
          sshpass -e ssh -p "$PORT" "${ARGS[@]}" "root@$HOST" 'bash /opt/rishestore-pars/deploy.sh'
      - name: Verify root domain
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://rishe.store/api/health | grep -q '"ok":true'; then
              echo "LIVE_SUCCESS: https://rishe.store/"
              exit 0
            fi
            sleep 5
          done
          echo "Public health check failed"
          exit 1
