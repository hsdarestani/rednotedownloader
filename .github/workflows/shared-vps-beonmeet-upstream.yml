name: Prepare BeOnMeet pinned recorder upstream sources without launching Chrome
on:
  push:
    branches: [ops/shared-vps-inventory-20261022]
    paths: [.github/workflows/shared-vps-beonmeet-upstream.yml]
permissions:
  contents: read
concurrency:
  group: pars-vps-staging
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm destination
        env:
          H: ${{ secrets.HOST }}
        run: test "$H" = "143.20.60.195"
      - name: Fetch original pinned recording-engine source, apply local patches
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT || '9011' }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 300 9
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            test "$(df -Pk / | awk 'NR==2 {print $4}')" -gt 4000000
            cd /opt/beonmeet
            PIN=1447ed3a38ce052a694872141a9b7085189e8513
            if [ ! -d upstream/.git ]; then
              git clone --filter=blob:none https://github.com/screenappai/meeting-bot.git upstream
            fi
            git -C upstream fetch --depth=1 origin "$PIN"
            git -C upstream checkout --detach "$PIN"
            cp patches/disk-uploader.ts upstream/src/middleware/disk-uploader.ts
            cp patches/Dockerfile.chrome-cdp upstream/Dockerfile.chrome-cdp
            cp patches/start-chrome-cdp.sh upstream/scripts/start-chrome-cdp.sh
            cp patches/JobStore.ts upstream/src/lib/JobStore.ts
            chmod +x upstream/scripts/start-chrome-cdp.sh
            python3 patches/apply-upstream-fixes.py
            sed -i 's/npx playwright install --with-deps$/npx playwright install --with-deps chromium/' upstream/Dockerfile.production
            sed -i 's/npx playwright install$/npx playwright install chromium/' upstream/Dockerfile.production
            sed -i 's/RUN npm run build/RUN NODE_OPTIONS=--max-old-space-size=2048 npm run build/' upstream/Dockerfile.production
            mkdir -p chrome-profile recorder-accounts
            chown -R beonmeet:beonmeet chrome-profile recorder-accounts
            chmod 700 chrome-profile recorder-accounts
            test -f upstream/Dockerfile.chrome-cdp
            test -f upstream/Dockerfile.production
            test -f upstream/src/middleware/disk-uploader.ts
            test "$(git -C upstream rev-parse HEAD)" = "$PIN"
            echo "Pinned BeOnMeet recorder source and patches staged. Chrome image NOT built or launched."
            df -h /
            systemctl is-active --quiet beonmeet-controller
            systemctl is-active --quiet rednotedownloader
            echo 'BEONMEET_RECORDER_SOURCE_READY'
