name: Stage Rishe original media and SQL
on:
  push:
    branches: [infra/rishe-parallel]
    paths: ['.github/workflows/rishe-stage-legacy.yml']
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Safely stage uploaded backup assets
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT || '9011' }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 20m
          script: |
            set -eu
            curl -fLSs --retry 3 --max-time 70 'https://raw.githubusercontent.com/hsdarestani/rednotedownloader/infra/rishe-parallel/tools/rishe-stage-backup-20261020.py' -o /tmp/rishe-stage-backup-20261020.py
            python3 /tmp/rishe-stage-backup-20261020.py
            echo '=== REQUIRED DATABASE TABLES ==='
            for t in wp_users wp_wc_orders wp_wc_order_addresses wp_woocommerce_order_items wp_woocommerce_order_itemmeta wp_wc_customer_lookup; do
              if grep -Fq "$t" /opt/rishestore-pars/legacy-20261020/rishesto_db.sql; then echo "$t YES"; else echo "$t NO"; fi
            done
            echo '=== SITE HEALTH ==='
            curl -fsS -m 15 http://127.0.0.1:3108/api/health
