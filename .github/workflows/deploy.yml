name: Deploy RedNote Downloader

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rednote-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Validate target host
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_PASS: ${{ secrets.PASS }}
        run: |
          test "$DEPLOY_HOST" = "143.20.60.195" && test -n "$DEPLOY_PASS"
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT || '9011' }}
          username: root
          password: ${{ secrets.PASS }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_API_ID,TELEGRAM_API_HASH
          command_timeout: 30m
          script: |
            set -eu
            # Only one application deploy may install OS packages or configure proxy at a time.
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 1200 9 || { echo "Timed out waiting for the shared VPS deployment lock"; exit 1; }
            case " $(hostname -I) " in
              *" 143.20.60.195 "*) echo "Pars VDS verified" ;;
              *) echo "Target is not intended Pars VDS, refusing deploy."; exit 1 ;;
            esac
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
              echo "TELEGRAM_BOT_TOKEN is missing"
              exit 1
            fi
            echo "===== Recent bot logs before deploy ====="
            journalctl -u rednotedownloader --since "30 minutes ago" --no-pager -n 250 || true
            echo "===== End recent bot logs ====="

            if [ ! -d /opt/rednotedownloader/.git ]; then
              git clone https://github.com/hsdarestani/rednotedownloader.git /opt/rednotedownloader
            else
              git -C /opt/rednotedownloader fetch origin main
              git -C /opt/rednotedownloader reset --hard origin/main
            fi
            chmod +x /opt/rednotedownloader/deploy.sh
            /opt/rednotedownloader/deploy.sh

            echo "===== Bot logs after deploy ====="
            journalctl -u rednotedownloader --since "5 minutes ago" --no-pager -n 100 || true
