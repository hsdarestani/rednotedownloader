name: Verify VPS SSH public host identity
on:
  push:
    branches: [ops/shared-vps-inventory-20261022]
    paths: [.github/workflows/shared-vps-host-public-key.yml]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - name: Validate host
        env:
          H: ${{ secrets.HOST }}
        run: test "$H" = "143.20.60.195"
      - name: Inspect public SSH host key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT || '9011' }}
          username: root
          password: ${{ secrets.PASS }}
          script: |
            set -e
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            echo "HOST_PUBLIC_KEY_BEGIN"
            for f in /etc/ssh/ssh_host_*.pub; do test -f "$f" || continue; echo "PUBLIC_KEY_FILE:$f"; cat "$f"; done
            sshd -T 2>/dev/null | grep -E '^(hostkey|port) ' || true
            echo "HOST_PUBLIC_KEY_END"
