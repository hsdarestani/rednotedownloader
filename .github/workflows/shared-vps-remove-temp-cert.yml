name: Remove obsolete temporary credentials envelope key
on:
  push:
    branches: [ops/shared-vps-inventory-20261022]
    paths: [.github/workflows/shared-vps-remove-temp-cert.yml]
permissions:
  contents: read
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Verify VPS
        env:
          H: ${{ secrets.HOST }}
        run: test "$H" = "143.20.60.195"
      - name: Remove only temporary envelope key unused by applications
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT || '9011' }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            if test -f /etc/shared-vps-secrets/recipient.crt; then
              openssl x509 -in /etc/shared-vps-secrets/recipient.crt -noout -subject | grep -Fq 'shared-vps-secrets-recipient'
              rm -f /etc/shared-vps-secrets/recipient.crt /etc/shared-vps-secrets/recipient.key
            fi
            systemctl is-active --quiet rednotedownloader
            systemctl is-active --quiet hamoon-dashboard
            systemctl is-active --quiet beonmeet-controller
            echo 'TEMPORARY_ENVELOPE_CERT_AND_PRIVATE_KEY_REMOVED'
